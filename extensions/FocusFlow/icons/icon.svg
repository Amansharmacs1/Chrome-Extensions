<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#151e36" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />

  <!-- Outer Pulse Ring -->
  <circle cx="64" cy="64" r="44" fill="none" stroke="#1e293b" stroke-width="4" stroke-dasharray="6 6" />

  <!-- Dynamic Progress Arc (Pomodoro active visual) -->
  <path d="M 64 20 A 44 44 0 1 1 25.8 42" fill="none" stroke="url(#ringGrad)" stroke-width="6" stroke-linecap="round" />

  <!-- Inner Flow Wave / Hourglass Vortex -->
  <path d="M 44 40 C 58 40 50 64 64 64 C 78 64 70 88 84 88 M 84 40 C 70 40 78 64 64 64 C 50 64 58 88 44 88"
        fill="none" stroke="url(#glowGrad)" stroke-width="5" stroke-linecap="round" filter="url(#glow)" />

  <!-- Center Focus Core Bead -->
  <circle cx="64" cy="64" r="7" fill="#ffffff" />
  <circle cx="64" cy="64" r="4" fill="#00d2ff" />
</svg>
