<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QRQuick — QR Generator & Scanner</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <img src="../assets/icons/icon32.png" alt="QRQuick Logo" class="brand-icon">
        <div>
          <h1 class="brand-title">QRQuick</h1>
          <p class="brand-tagline">Generate. Customize. Share.</p>
        </div>
      </div>
      <div class="header-actions">
        <a href="../scanner/scanner.html" target="_blank" class="icon-btn" title="Scan QR Code">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 7V5a2 2 0 0 1 2-2h2"></path>
            <path d="M17 3h2a2 2 0 0 1 2 2v2"></path>
            <path d="M21 17v2a2 2 0 0 1-2 2h-2"></path>
            <path d="M7 21H5a2 2 0 0 1-2-2v-2"></path>
            <line x1="7" y1="12" x2="17" y2="12"></line>
          </svg>
        </a>
        <a href="../dashboard/dashboard.html" target="_blank" class="icon-btn" title="History & Analytics">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
        </a>
      </div>
    </header>

    <!-- Source Selector Tabs -->
    <nav class="source-nav">
      <button class="nav-tab active" id="tabCurrentPage">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="2" y1="12" x2="22" y2="12"></line>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
        </svg>
        Current Page
      </button>
      <button class="nav-tab" id="tabQuickText">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="4 7 4 4 20 4 20 7"></polyline>
          <line x1="9" y1="20" x2="15" y2="20"></line>
          <line x1="12" y1="4" x2="12" y2="20"></line>
        </svg>
        Quick Text
      </button>
    </nav>

    <!-- Content Inputs -->
    <div class="input-panel">
      <!-- Current Page View -->
      <div id="viewCurrentPage" class="tab-view active">
        <div class="page-info-card">
          <div class="page-title" id="pageTitle">Loading active webpage...</div>
          <div class="page-url" id="pageUrl">...</div>
        </div>
      </div>

      <!-- Quick Text View -->
      <div id="viewQuickText" class="tab-view">
        <textarea id="quickTextInput" class="text-input" placeholder="Type or paste any URL, text, or Wi-Fi note..." rows="2"></textarea>
      </div>
    </div>

    <!-- QR Canvas Container -->
    <div class="preview-card">
      <div class="canvas-wrapper">
        <canvas id="popupCanvas" width="200" height="200"></canvas>
      </div>
      <div id="qrCapacityWarning" class="warning-banner" hidden></div>
    </div>

    <!-- Quick Action Buttons -->
    <div class="action-grid">
      <button id="btnDownloadPng" class="action-btn primary" title="Download High-Res PNG">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        Download PNG
      </button>
      <button id="btnCopyImage" class="action-btn secondary" title="Copy QR to Clipboard">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
        </svg>
        Copy Image
      </button>
      <button id="btnDownloadSvg" class="action-btn secondary" title="Download Vector SVG">
        SVG
      </button>
    </div>

    <!-- Launch Full Studio -->
    <div class="studio-link-wrap">
      <a href="../generator/generator.html" target="_blank" class="studio-link" id="linkFullStudio">
        <span>Customize & Advanced Types (Wi-Fi, vCard...)</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </a>
    </div>

    <!-- Footer Quick Tools -->
    <footer class="popup-footer">
      <a href="../scanner/scanner.html" target="_blank" class="footer-chip">
        <span>Scan Image</span>
      </a>
      <a href="../bulk/bulk.html" target="_blank" class="footer-chip">
        <span>Bulk Generator</span>
      </a>
      <a href="../dashboard/dashboard.html" target="_blank" class="footer-chip">
        <span>History</span>
      </a>
    </footer>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
